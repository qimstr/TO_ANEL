<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Card</title>
    <link rel="stylesheet" href="style.css">
    <!-- iOS ТҮЗЕТУЛЕРІ -->
    <link rel="stylesheet" href="style-ios-fixed.css">
</head>
<body>
    <div class="card-closed" id="closedCard" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);">
        <div class="envelope">
            <div class="envelope-heart">❤</div>
            <div class="envelope-text">For You</div>
        </div>
        <button class="open-btn" onclick="openCard()">OPEN</button>
    </div>

    <div class="card-opened" id="openedCard" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);">
        <div class="letter">
            <div class="letter-header">
                <h2>To Anel</h2>
                <div class="valentine-date">Happy Valentine's Day</div>
            </div>
            
            <div class="letter-content handwriting">
                <p>Желаю тебе найти настоящего возлюбленного а если все же не получится найти то ты можешь всегда положится на меня желаю найти настоящего валентинку твоей жизни а так всегда помни что я люблю тебя</p>
            </div>
            
            <button class="tap-btn" onclick="goToHearts()">Tap me</button>
        </div>
        <button class="close-btn" onclick="closeCard()">CLOSE</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
