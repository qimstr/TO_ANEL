<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Card for Anel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #14000a 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Жұлдызшалар фонға */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                radial-gradient(circle at 60% 70%, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                radial-gradient(circle at 40% 20%, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 150px 150px, 200px 200px, 180px 180px;
            z-index: 1;
            pointer-events: none;
            animation: twinkle 8s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }

        .card-closed {
            width: 450px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .card-opened {
            width: 380px;
            text-align: center;
            position: relative;
            z-index: 2;
            transform: scale(0.85);
            transform-origin: center;
        }

        .envelope {
            background: linear-gradient(135deg, #ff3366 0%, #ff0066 100%);
            height: 280px;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 20px 40px rgba(255, 51, 102, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(
                circle at 30% 30%,
                rgba(255, 255, 255, 0.1) 0%,
                transparent 50%
            );
            pointer-events: none;
        }

        .envelope-heart {
            font-size: 90px;
            color: white;
            margin-bottom: 20px;
            text-shadow: 
                0 5px 15px rgba(0, 0, 0, 0.3),
                0 0 30px rgba(255, 255, 255, 0.2);
            animation: heartbeat 1.8s infinite;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        @keyframes heartbeat {
            0%, 100% { 
                transform: scale(1) rotate(0deg); 
            }
            25% { 
                transform: scale(1.1) rotate(-5deg); 
            }
            75% { 
                transform: scale(1.1) rotate(5deg); 
            }
        }

        .envelope-text {
            color: white;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            background: linear-gradient(to right, #ffffff, #ffe6ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .open-btn, .close-btn {
            width: 100%;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .open-btn::before, .close-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: left 0.5s;
        }

        .open-btn:hover::before, .close-btn:hover::before {
            left: 100%;
        }

        .open-btn {
            background: linear-gradient(135deg, #ff3366, #ff1493);
            color: white;
            box-shadow: 
                0 10px 30px rgba(255, 51, 102, 0.4),
                0 0 20px rgba(255, 20, 147, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .open-btn:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 15px 40px rgba(255, 51, 102, 0.6),
                0 0 30px rgba(255, 20, 147, 0.4);
        }

        .close-btn {
            background: linear-gradient(135deg, #6c757d, #495057);
            color: white;
            margin-top: 25px;
            box-shadow: 0 8px 25px rgba(108, 117, 125, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.05);
        }

        .close-btn:hover {
            background: linear-gradient(135deg, #495057, #343a40);
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(108, 117, 125, 0.5);
        }

        .card-opened {
            display: none;
        }

        .letter {
            background: linear-gradient(135deg, 
                rgba(20, 0, 10, 0.9) 0%, 
                rgba(0, 0, 0, 0.85) 100%);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .letter::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(
                90deg,
                transparent,
                #ff3366,
                #ff1493,
                #ff3366,
                transparent
            );
        }

        .letter::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            pointer-events: none;
        }

        .letter-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            position: relative;
        }

        .letter-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            right: 25%;
            height: 2px;
            background: linear-gradient(
                90deg,
                transparent,
                #ff3366,
                #ff1493,
                #ff3366,
                transparent
            );
        }

        .letter-header h2 {
            color: #ff3366;
            font-size: 28px;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(255, 51, 102, 0.3);
            background: linear-gradient(to right, #ff3366, #ff1493);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .valentine-date {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            font-style: italic;
            letter-spacing: 1px;
        }

        .letter-content {
            text-align: left;

        }

        .handwriting {
            font-family: 'Brush Script MT', cursive;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .wishes {
            margin: 25px 0;
            padding: 0;
        }

        .wish {
            font-family: 'Brush Script MT', cursive;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 8px;
            line-height: 1.4;
            padding-left: 0;
        }

        .tap-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff3366, #ff0066);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 8px 25px rgba(255, 51, 102, 0.5),
                0 0 20px rgba(255, 0, 102, 0.3);
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            margin-top: 20px;
        }

        .tap-btn:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 15px 35px rgba(255, 51, 102, 0.7),
                0 0 30px rgba(255, 0, 102, 0.5);
            background: linear-gradient(135deg, #ff0066, #ff3366);
        }

        /* Анимациялар */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeInMedium {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(0.85);
            }
        }

        .card-closed {
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-opened {
            animation: fadeInMedium 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Адаптивтілік */
        @media (max-width: 500px) {
            .card-closed {
                width: 90vw;
                padding: 0 10px;
            }
            
            .card-opened {
                width: 76vw;
            }
            
            .envelope {
                height: 220px;
            }
            
            .envelope-heart {
                font-size: 70px;
            }
            
            .envelope-text {
                font-size: 26px;
            }
            
            .letter {
                padding: 20px;
            }
            
            .letter-header h2 {
                font-size: 24px;
            }
            
            .handwriting {
                font-size: 20px;
            }
            
            .wish {
                font-size: 16px;
            }
            
            .open-btn, .close-btn {
                padding: 16px;
                font-size: 18px;
            }
            
            .tap-btn {
                padding: 14px;
                font-size: 16px;
            }
        }

        /* Жүрек беті стильдері (heart.html) */
        .heart-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            z-index: 1000;
        }

        .canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #heartCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.3s;
            font-family: Arial, sans-serif;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Floating stars animation */
        .floating-star {
            position: fixed;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            animation: floatStar linear infinite;
        }

        @keyframes floatStar {
            from {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            to {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Letter size adjustments */
        .card-opened {
            width: 500px;
            max-width: 90%;
        }
        
        .letter {
            padding: 40px 35px;
            width: 100%;
        }

        .letter-content.handwriting {
            min-height: 200px;
            max-height: 300px;
            overflow-y: auto;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            line-height: 1.6;
            font-size: 18px;
        }

        .close-btn {
            position: relative;
            bottom: 0;
            right: 0;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Негізгі карта беті -->
    <div id="mainCardPage">
        <div class="card-closed" id="closedCard">
            <div class="envelope">
                <div class="envelope-heart">❤</div>
                <div class="envelope-text"></div>
            </div>
            <button class="open-btn" onclick="openCard()">OPEN</button>
        </div>

        <div class="card-opened" id="openedCard">
            <div class="letter">
                <div class="letter-header">
                    <h2>To Anel</h2>
                    <div class="valentine-date">Happy Valentine's Day</div>
                </div>
                
                <div class="letter-content handwriting">
                    <p>Желаю тебе найти настоящего возлюбленного а если все же не получится найти то ты можешь всегда положится на меня желаю найти настоящего валентинку твоей жизни а так всегда помни что я люблю тебя</p>
                </div>
                
                <button class="tap-btn" onclick="goToHearts()">Tap me</button>
            </div>
            <button class="close-btn" onclick="closeCard()">CLOSE</button>
        </div>
    </div>

    <!-- Жүрек анимация беті (бастапқыда жасырын) -->
    <div id="heartPage" class="heart-page">
        <button class="back-btn" onclick="goBackToCard()">← Back to Card</button>
        
        <div class="canvas-container">
            <canvas id="heartCanvas"></canvas>
        </div>
    </div>

    <script>
        // Карта функциялары
        function openCard() {
            const closedCard = document.getElementById('closedCard');
            const openedCard = document.getElementById('openedCard');
            
            // Жұлдызшалар эффектісі
            createStars(15);
            
            // Анимация жабу
            closedCard.style.animation = 'none';
            closedCard.style.opacity = '0';
            closedCard.style.transform = 'scale(0.9) translateY(20px)';
            
            setTimeout(() => {
                closedCard.style.display = 'none';
                openedCard.style.display = 'block';
                
                // Анимация ашу
                setTimeout(() => {
                    openedCard.style.animation = 'fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                    openedCard.style.opacity = '1';
                    openedCard.style.transform = 'scale(1) translateY(0)';
                }, 10);
            }, 400);
        }

        function closeCard() {
            const closedCard = document.getElementById('closedCard');
            const openedCard = document.getElementById('openedCard');
            
            // Жұлдызшалар эффектісі
            createStars(10);
            
            // Анимация жабу
            openedCard.style.animation = 'none';
            openedCard.style.opacity = '0';
            openedCard.style.transform = 'scale(0.9) translateY(20px)';
            
            setTimeout(() => {
                openedCard.style.display = 'none';
                closedCard.style.display = 'block';
                
                // Анимация ашу
                setTimeout(() => {
                    closedCard.style.animation = 'fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                    closedCard.style.opacity = '1';
                    closedCard.style.transform = 'scale(1) translateY(0)';
                }, 10);
            }, 400);
        }

        function goToHearts() {
            // Жүректер эффектісі
            createHeartsEffect();
            
            // 2 секундтан кейін бетті ауыстыру
            setTimeout(() => {
                document.getElementById('mainCardPage').style.display = 'none';
                document.getElementById('heartPage').style.display = 'block';
                startHeartAnimation();
            }, 1000);
        }

        function goBackToCard() {
            document.getElementById('heartPage').style.display = 'none';
            document.getElementById('mainCardPage').style.display = 'flex';
            
            // Картаны жабу режиміне қайтару
            const closedCard = document.getElementById('closedCard');
            const openedCard = document.getElementById('openedCard');
            closedCard.style.display = 'block';
            openedCard.style.display = 'none';
        }

        function createStars(count) {
            for(let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'floating-star';
                star.style.width = star.style.height = (2 + Math.random() * 5) + 'px';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (10 + Math.random() * 15) + 's';
                
                document.body.appendChild(star);
                
                // Тазалау
                setTimeout(() => star.remove(), 10000);
            }
        }

        function createHeartsEffect() {
            for(let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤';
                heart.style.position = 'fixed';
                heart.style.fontSize = (30 + Math.random() * 50) + 'px';
                heart.style.color = `hsl(${340 + Math.random()*20}, 100%, ${60 + Math.random()*20}%)`;
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '100vh';
                heart.style.zIndex = '1000';
                heart.style.pointerEvents = 'none';
                heart.style.opacity = '0';
                heart.style.filter = 'drop-shadow(0 0 10px currentColor)';
                
                document.body.appendChild(heart);
                
                // Анимация
                const animation = heart.animate([
                    { 
                        transform: 'translateY(0) scale(0) rotate(0deg)', 
                        opacity: 0 
                    },
                    { 
                        transform: 'translateY(-50px) scale(1) rotate(-10deg)', 
                        opacity: 0.8 
                    },
                    { 
                        transform: 'translateY(-100vh) scale(1.3) rotate(10deg)', 
                        opacity: 0 
                    }
                ], {
                    duration: 1800 + Math.random() * 1000,
                    easing: 'cubic-bezier(0.215, 0.61, 0.355, 1)'
                });
                
                animation.onfinish = () => heart.remove();
            }
        }

        // Бастапқы жұлдызшалар
        document.addEventListener('DOMContentLoaded', () => {
            createStars(30);
            
            const closedCard = document.getElementById('closedCard');
            const openedCard = document.getElementById('openedCard');
            
            closedCard.style.opacity = '1';
            closedCard.style.transform = 'scale(1) translateY(0)';
            openedCard.style.opacity = '0';
            openedCard.style.transform = 'scale(0.9) translateY(20px)';
        });

        // Фондағы жұлдызшаларды қайта жасау
        setInterval(() => {
            if (Math.random() > 0.7) {
                createStars(3);
            }
        }, 3000);

        // Жүрек анимациясының кодтары
        let heartAnimationRunning = false;

        function startHeartAnimation() {
            if (heartAnimationRunning) return;
            heartAnimationRunning = true;

            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const settings = {
                mainText: "Котенчик",
                mainTextSize: 40,
                mainPulseSpeed: 0.015,
                mainPulseAmount: 0.05,
                mainColor: "#fe7dccbd",
                shadowColor: "#f8175e",
                mainGlow: true,
                
                heartText: "I love you",
                heartTextCount: 70,
                heartTextSize: 16,
                heartSize: 24,
                heartSpeed: 0.002,
                heartColor: "rgba(255, 51, 102, 0.3)",
                heartOpacity: 0.1,
                
                currentTime: 0,
                heartAngle: 0,
                particlesCount: 20,
                
                showMainText: true,
                showHeart: true,
                showParticles: true
            };

            // ⭐ БӨЛШЕКТЕР ⭐
            class Particle {
                constructor() {
                    this.reset();
                }
                
                reset() {
                    this.angle = Math.random() * Math.PI * 2;
                    this.distance = 50 + Math.random() * 150;
                    this.speed = 0.5 + Math.random() * 1;
                    this.size = 2 + Math.random() * 4;
                    this.opacity = 0.2 + Math.random() * 0.3;
                }
                
                update() {
                    this.angle += 0.01;
                    this.distance += Math.sin(settings.currentTime * 0.002 + this.angle) * 0.5;
                }
                
                draw(centerX, centerY) {
                    const x = centerX + Math.cos(this.angle) * this.distance;
                    const y = centerY + Math.sin(this.angle) * this.distance;
                    
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(255, 51, 102, ${this.opacity})`;
                    ctx.arc(x, y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            const particles = [];
            for (let i = 0; i < settings.particlesCount; i++) {
                particles.push(new Particle());
            }

            // ⭐ ЖҮРЕК ФОРМАСЫ ⭐
            function heartPosition(t) {
                const x = 12.5 * Math.pow(Math.sin(t), 3);
                const y = 10.2 * Math.cos(t) - 
                          2.7 * Math.cos(2*t) - 
                          2.3 * Math.cos(3*t) - 
                          0.001 * Math.cos(4*t);
                
                return { x, y: -y };
            }

            // ⭐ АРТТАҒЫ ЖҮРЕК АНИМАЦИЯСЫ ⭐
            function drawHeartAnimation() {
                if (!settings.showHeart) return;
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                const wave = Math.sin(settings.currentTime * 0.005) * 0.05;
                
                for (let i = 0; i < settings.heartTextCount; i++) {
                    const localOffset = (i / settings.heartTextCount) * Math.PI * 2;
                    let t = (settings.heartAngle + localOffset) % (Math.PI * 2);
                    
                    const pos = heartPosition(t);
                    
                    const opacity = settings.heartOpacity * (0.7 + 0.3 * Math.sin(t * 2 + settings.currentTime * 0.01));
                    
                    const x = centerX + pos.x * (settings.heartSize * (1 + wave));
                    const y = centerY + pos.y * (settings.heartSize * (1 + wave));
                    
                    ctx.font = `${settings.heartTextSize}px Arial`;
                    ctx.fillStyle = `rgba(255, 51, 102, ${opacity})`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(settings.heartText, x, y);
                }
                
                settings.heartAngle += settings.heartSpeed;
            }

            // ⭐ ОРТАДАҒЫ НЕГІЗГІ МӘТІН ⭐
            function drawMainText() {
                if (!settings.showMainText) return;
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                const pulse = 1 + Math.sin(settings.currentTime * settings.mainPulseSpeed) * settings.mainPulseAmount;
                const fontSize = settings.mainTextSize * pulse;
                
                // ⭐ 1. Бірінші қабат: Розовый shadow ⭐
                ctx.save();
                ctx.shadowColor = settings.shadowColor;
                ctx.shadowBlur = 25 * pulse;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                
                ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                ctx.fillStyle = settings.mainColor;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(Math.sin(settings.currentTime * 0.001) * 0.03);
                ctx.fillText(settings.mainText, 0, 0);
                ctx.restore();
                
                ctx.restore();
                
                // ⭐ 2. Екінші қабат: Негізгі мәтін ⭐
                ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                ctx.fillStyle = settings.mainColor;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(Math.sin(settings.currentTime * 0.001) * 0.03);
                ctx.fillText(settings.mainText, 0, 0);
                ctx.restore();
                
                // ⭐ 3. Үшінші қабат: Glow эффекті ⭐
                ctx.save();
                ctx.globalCompositeOperation = "overlay";
                ctx.fillStyle = `rgba(255, 105, 180, 0.15)`;
                ctx.font = `bold ${fontSize}px Arial, sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(Math.sin(settings.currentTime * 0.001) * 0.03);
                
                const glowOffset = Math.sin(settings.currentTime * 0.02) * 3;
                ctx.fillText(settings.mainText, glowOffset, glowOffset);
                ctx.restore();
                ctx.restore();
                
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
            }

            // ⭐ БӨЛШЕКТЕР ⭐
            function drawParticles() {
                if (!settings.showParticles) return;
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                particles.forEach(particle => {
                    particle.update();
                    particle.draw(centerX, centerY);
                });
            }

            // ⭐ ФОН ЭФФЕКТІ ⭐
            function drawBackground() {
                const gradient = ctx.createRadialGradient(
                    canvas.width / 2, canvas.height / 2, 0,
                    canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) / 2
                );
                
                gradient.addColorStop(0, 'rgba(0, 0, 0, 0.1)');
                gradient.addColorStop(1, 'rgba(20, 0, 10, 0.3)');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                for (let i = 0; i < 50; i++) {
                    const x = (Math.sin(settings.currentTime * 0.001 + i) * 0.5 + 0.5) * canvas.width;
                    const y = (Math.cos(settings.currentTime * 0.001 + i * 0.7) * 0.5 + 0.5) * canvas.height;
                    const size = Math.sin(settings.currentTime * 0.01 + i) * 0.5 + 1;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function clearCanvas() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            function animate() {
                if (!heartAnimationRunning) return;
                
                clearCanvas();
                drawBackground();
                drawHeartAnimation();
                drawParticles();
                drawMainText();
                
                settings.currentTime += 1;
                requestAnimationFrame(animate);
            }

            // Браузер өлшемі өзгергенде
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });

            // Бастау
            animate();

            console.log("=========================================");
            console.log("❤️ КОТЕНЧИК - АҚ ТҮС + РОЗОВЫЙ SHADOW");
            console.log("=========================================");
        }

        // Heart page-ке өткенде анимацияны бастау
        function checkHeartPage() {
            if (window.location.hash === '#heart') {
                document.getElementById('mainCardPage').style.display = 'none';
                document.getElementById('heartPage').style.display = 'block';
                startHeartAnimation();
            }
        }

        // Sayfa yüklendiğinde kontrol et
        window.addEventListener('load', checkHeartPage);
    </script>
</body>
</html>
